[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mobilevalidate-sdk"
version = "1.1.0"
description = "MobileValidate API client: check phone numbers on WhatsApp, Telegram, Viber and more, carrier lookup, spam reputation and e-mail verification. Sync + async, typed."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MobileValidate (BroadNet Technologies Inc.)" }]
keywords = ["phone validation", "phone number", "whatsapp check", "telegram", "viber", "hlr", "carrier lookup",
  "line type", "spam reputation", "email verification", "api client", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Communications :: Telephony",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.24,<1",
  "typing_extensions>=4.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20", "build>=1"]

[project.urls]
Homepage = "https://mobilevalidate.com/docs/sdk"
Documentation = "https://mobilevalidate.com/docs"
Repository = "https://github.com/brntech/mobilevalidate-sdk/tree/main/python"
Issues = "https://github.com/brntech/mobilevalidate-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mobilevalidate"]

[tool.hatch.build.targets.sdist]
include = ["src/mobilevalidate", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
